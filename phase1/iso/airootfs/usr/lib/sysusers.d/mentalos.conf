# mentalOS live image system users.
#
# Created at boot by systemd-sysusers. This is a build-independent fallback:
# customize_airootfs.sh also creates the user at build time (with a proper
# home directory and skel copy); if the script fails, this fragment still
# guarantees the account exists.
u user 1000 "mentalOS live user" /home/user /bin/bash
