[package]
name = "mentalOS"
version = "0.1.0"
edition = "2024"

[dependencies]
glib = "0.18"
gtk4 = "0.7.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
regex = "1"
shell-words = "1"
sysinfo = "0.31"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
