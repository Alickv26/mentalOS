name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_sandbox_smoke:
        description: "Run sandbox smoke tests"
        required: false
        default: "false"

jobs:
  fmt-and-test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: mentalOS-prototype

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgraphene-1.0-dev \
            libgdk-pixbuf-2.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mentalOS-prototype -> target

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test -q

  sandbox-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_sandbox_smoke == 'true' }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: mentalOS-prototype

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgraphene-1.0-dev \
            libgdk-pixbuf-2.0-dev \
            firejail

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mentalOS-prototype -> target

      - name: Run sandbox smoke tests
        run: ./scripts/sandbox_smoke.sh
