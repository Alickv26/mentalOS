# mentalOS live image runtime directories.
#
# Created at boot by systemd-tmpfiles (runs before the mentalOS services,
# which have ReadWritePaths= pointing at these paths).
d /var/lib/mentalOS 0755 user user -
d /var/lib/ollama 0750 ollama ollama -
d /var/lib/ollama/models 0755 ollama ollama -
d /home/user/workspaces 0755 user user -
d /home/user/workspaces/.mentalOS 0755 user user -
