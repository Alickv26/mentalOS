SERIAL 0 115200
UI menu.c32

MENU TITLE mentalOS 0.1.0
# To add a bootsplash background, drop a PNG at the path below and
# uncomment the MENU BACKGROUND line. PNG must be 640x480, 16-colour indexed.
# MENU BACKGROUND /%INSTALL_DIR%/boot/%ARCH%/syslinux/mentalos-bg.png

MENU COLOR border  30;44   #40404080 #00000000 std
MENU COLOR title   1;36;44 #ffffffff #00000000 std
MENU COLOR sel      7;37;40 #ff5555ff #a0a0a0ff all
MENU COLOR unsel    37;44  #ffffffff #00000000 std
MENU COLOR help     37;40  #aaaaaaaa #00000000 std
MENU COLOR timeout_msg 37;40 #aaaaaaaa #00000000 std
MENU COLOR timeout   1;37;40 #ff5555ff #00000000 std
MENU COLOR msg07     37;40  #aaaaaaaa #00000000 std

MENU WIDTH 80
MENU MARGIN 10
MENU ROWS 5
MENU VSHIFT 4
MENU TIMEOUTROW 12
MENU TABMSGROW 14
MENU CMDLINEROW 14

DEFAULT mentalos
TIMEOUT 30

INCLUDE syslinux-linux.cfg
