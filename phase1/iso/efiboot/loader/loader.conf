# systemd-boot loader config for mentalOS live ISO
# https://systemd.io/BOOT_LOADER_SPECIFICATION/

# 3-second timeout — fast boot on dedicated hardware, but gives time to
# interrupt with arrow keys for debugging.
timeout 3

# Default to the primary mentalOS boot entry.
default 01-mentalos-linux.conf

# Show the menu by default so users can interrupt if needed.
# Comment out for a fully silent boot.
console-mode keep
