[package]
name = "mentalOS"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
